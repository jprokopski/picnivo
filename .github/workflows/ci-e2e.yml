name: CI E2E

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "supabase/**"
      - "dev.sh"
      - ".github/workflows/ci-e2e.yml"

concurrency:
  group: ci-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: supabase/setup-cli@v1
        with:
          version: 2.104.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Restore backend tools & packages
        working-directory: backend
        run: |
          dotnet tool restore
          dotnet restore Picnivo.API

      # Playwright's webServer (frontend/playwright.config.ts) boots the real
      # stack itself via `../dev.sh`, which runs `supabase start` on its own.
      # We start-then-stop once here first purely to pull the Postgres/Auth
      # images and read out the local anon key — so the start inside dev.sh
      # only has to boot already-cached containers within the webServer
      # timeout.
      - name: Prime Supabase and write frontend env
        run: |
          supabase start -x realtime,storage-api,imgproxy,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          ANON_KEY=$(supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '"')
          echo "VITE_SUPABASE_URL=http://localhost:54321" > frontend/.env
          echo "VITE_SUPABASE_ANON_KEY=${ANON_KEY}" >> frontend/.env
          echo "VITE_API_URL=http://localhost:5000" >> frontend/.env
          supabase stop --no-backup

      - name: Run e2e tests
        working-directory: frontend
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
